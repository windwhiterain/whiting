[package]
name = "whiting-device-rasterize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rasterising render backends for the whiting device."

[dependencies]
definition = { workspace = true }
graphics = { workspace = true }
scene = { workspace = true }
device = { workspace = true }

wgpu = { workspace = true }
png = { workspace = true }

# The render harness writes the manifest that records what each frame hashed to, and the probes
# read the pixel back through the same async runtime the device serves over. They are dependencies
# of the harness rather than optional ones because a backend that cannot report what it rendered
# is not a backend.
facet = { workspace = true }
facet-json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# The document crate: the builders that write a scene document. The probes and the render
# harness build their scenes with these, and the harness reads a document the gallery wrote.
#
# The gallery is **not** a dependency here, and that is the point of the split: a renderer draws
# a document and knows no scene by name, so a change to a scene must not relink the renderer. The
# one probe that is reconciled against a gallery scene lives with the gallery, in
# `crates/gallery/examples/shadow_probe.rs`.
document = { workspace = true }

# Everything below draws on a real gpu and reads the pixels back, which is a question only an
# adapter can answer. The harness that does it is an example, and it is named here rather than
# auto-discovered so that a plain `cargo test --workspace` on a machine with no gpu skips it by
# name instead of failing to resolve `wgpu` at all.
[[example]]
name = "render"

# The crate's tests are gathered in one binary, `tests/device-rasterize.rs`, with a separate file
# for each subject under `tests/device-rasterize/`. One binary is one link, and the subjects that
# need no adapter run on a machine with no gpu alongside the ones that do: they check a parsed
# module's shape against a binding layout, and they still live here because the check itself
# belongs to the backend, and a check that could only run where a driver exists would go
# unchecked exactly where a scene's shader is written.
[[test]]
name = "device-rasterize"