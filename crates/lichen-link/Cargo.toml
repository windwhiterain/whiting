# Generated by `cargo run -p whiting-lichen-stages --example generate_link`.
#
# `crate-type = ["dylib"]` and `lichen-language` by path are the ruling
# docs/notes/native-link-library.md §4 records: the library is loaded, never
# linked, and it shares the host's lichen so an entry may cross lichen values.
[package]
name = "whiting-lichen-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The alpine-oak stages, loaded through a `link` directive."

[lib]
crate-type = ["dylib"]
path = "src/lib.rs"

[dependencies]
lichen-language = { workspace = true }
lichen-lowlevel = { workspace = true }
lichen-utils = { workspace = true }
lichen-stages = { workspace = true }

# The gate the loader enforces, written where the crate is built.
# program = "lichen_language::program::LangProgram"
