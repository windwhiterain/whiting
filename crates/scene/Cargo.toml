[package]
name = "whiting-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Compilers from a scene schema to graphics instructions, with incremental deltas."

[dependencies]
definition = { workspace = true }
graphics = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Already in the lock file through wgpu, so this compiles nothing new. It is here to put the
# check beside the WGSL it checks: parsing and validating a shader is pure cpu work that needs
# no adapter, which is what makes the gallery's WGSL checkable on a machine with no gpu.
naga = { version = "30.0.1", features = ["wgsl-in"] }
