[package]
name = "whiting-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Builders for standard scene documents, and the scenes built with them."

[dependencies]
definition = { workspace = true }
graphics = { workspace = true }
scene = { workspace = true }
# The `landscape` scene is the mountain crate's first caller: it authors a massif as a ridge and
# valley skeleton, expands it, and draws the facets.
mountain = { workspace = true }
# The other direction out of a massif: `patchmesh` turns those same facets into an editable patch
# surface. This crate is where the two meet, because it is the only crate that sees both — neither
# `mountain` nor `patch` may know about the other, so the conversion has to live above them.
patch = { workspace = true }
# The direction after that: `terrain` reads a massif's facets onto a lattice and erodes it,
# which is the downstream pipeline SPEC/mountain.md R6 puts outside the `mountain` crate. It
# lives in the gallery because the gallery is the only crate that sees the massif and the
# erosion of one at the same time, and the scene is what a height field is drawn from.
terrain = { workspace = true }
# An authored building, drawn as the solids it expands to. `building_mesh` is where the two meet:
# a building carries its provenance per face and a scene carries a material per instance, and the
# conversion between those two facts is nobody else's business.
building = { workspace = true }
# The `sweep_picture` scene: its four shapes are four `Sweep::sample` calls and nothing else, so the
# scene cannot be written without the crate that owns the sweep. A library module cannot reach a
# dev-dependency, which is why this is an ordinary edge and not one under `[dev-dependencies]`.
shape = { workspace = true }
# The `bamboo` picture: a scene that draws a plant owns the conversion from that crate's geometry
# to this crate's documents, the way `building_mesh` owns the one for a building's solids. A plant
# is a tree of lofts and a field of rigid frames; a scene is packed points and instance transforms,
# and neither crate may know about the other.
vegetation = { workspace = true }

# The producer writes the scene document out as the json a renderer reads, and the library
# itself never writes a file. `facet-json` is the encoder both the writer and the reader use,
# so the two agree on the spelling by construction.
[dev-dependencies]
facet-json = { workspace = true }
