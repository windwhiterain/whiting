version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Author a plant as a spine tree whose attachments are named, and expand it into closed solids and instanced leaves."

# `shape` for the curve every spine is, the section every branch and blade is, and the sweep that turns
