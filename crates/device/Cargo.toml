[package]
name = "whiting-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hot-reloadable headless graphics device served over http RPC."

[features]
default = ["png"]
png = ["dep:png"]

[dependencies]
definition = { workspace = true }
graphics = { workspace = true }
scene = { workspace = true }

facet = { workspace = true }
facet-json = { workspace = true, features = ["axum"] }
facet-axum = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
# A read back float image is decoded rather than handed on as raw texels, so the half float
# conversion has one home instead of one per caller.
half = { workspace = true }

png = { workspace = true, optional = true }

# The gallery is what the probes draw and what the render test reads, so it is a development
# dependency: nothing in the device itself knows a scene by name.
[dev-dependencies]
gallery = { workspace = true }