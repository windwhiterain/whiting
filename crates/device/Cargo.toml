[package]
name = "whiting-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hot-reloadable headless graphics device served over http RPC."

[features]
default = ["png"]
png = ["dep:png"]
wgpu = ["dep:wgpu"]

[dependencies]
definition = { workspace = true }
graphics = { workspace = true }
scene = { workspace = true }

facet = { workspace = true }
facet-json = { workspace = true, features = ["axum"] }
facet-axum = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

wgpu = { workspace = true, optional = true }
png = { workspace = true, optional = true }

# The render harness drives the gpu backend, so it is only built when that backend is.
[[example]]
name = "render"
required-features = ["wgpu"]

# The sampled texture channel is only meaningful against a real device: what it checks is
# that a sampler reaches the gpu at the number the document implies, and that the pixels a
# texture was uploaded with are the ones a shader reads back.
[[test]]
name = "texture_channel_render"
required-features = ["wgpu"]

# A scene that samples an image has to be drawn to be shown to work: the compiler's own
# tests see the documents it emitted and not the frame that came out.
[[test]]
name = "gallery_render"
required-features = ["wgpu"]
